# Defaults are a lint/local sample (pichu). In the cluster the row AppSets inject the
# dpoc block (PLAN §4) and image.tag; infra/app/landscapes/<l>.yaml overrides per landscape.
replicas: 2 # per cluster: raichu has 2 clusters -> 4 replicas in that landscape

image:
  repository: reg.dpoc.specpenguin.dev/dpoc-aldehyde-lithium
  tag: "" # empty -> .Chart.AppVersion

dpoc:
  platform: aldehyde
  service: lithium
  landscape: pichu
  cluster: pichu-opal
  mark: opal
  region: SIN
  roots:
    - c.dpoc.specpenguin.dev
    - cf.dpoc.specpenguin.dev
    - s.dpoc.specpenguin.dev
