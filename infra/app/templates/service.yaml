apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.dpoc.platform }}
  labels:
{{ include "lithium.labels" . | indent 4 }}
spec:
  selector:
    app: {{ .Chart.Name }}
  ports:
    - {name: http, port: 3001, targetPort: http}
    - {name: admin, port: 3002, targetPort: admin}
